name: Evaluar pronunciación
on:
  push:
    branches: [eval]
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ["W", "S", "L,X", "D", "E"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q faster-whisper==1.1.1
      - run: python run.py
        env:
          ONLY: ${{ matrix.part }}
