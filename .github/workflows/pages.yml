name: Publicar juego
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el modelo de reconocimiento de voz (Vosk, inglés)
        run: |
          curl -sSL --retry 3 -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip
          mv vosk-model-small-en-us-0.15 model
          tar -cf - model | gzip -9 > site/model.tar.gz
      - name: Lista de palabras que el modelo de voz no conoce
        run: |
          python3 - <<'PY'
          import json, os
          vocab = set()
          for p in ('model/graph/words.txt', 'model/words.txt'):
              if os.path.exists(p):
                  vocab = {l.split()[0] for l in open(p, encoding='utf-8') if l.strip()}
                  break
          words = [l.split('|')[0].lower() for l in open('site/words.txt', encoding='utf-8') if l.strip()]
          oov = [w for w in words if vocab and any(t not in vocab for t in w.replace('-', ' ').split())]
          json.dump(oov, open('site/oov.json', 'w'))
          print(len(vocab), 'palabras en el modelo;', len(oov), 'sin reconocer:', oov)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
