<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Colmena Spelling Bee</title>

<style>
/* Layout: a single-column "hive" app — a sticky honeycomb tab bar over one working card; levels drawn as hexagon cells. */
:root{
  --bg:#FFF9EC; --surface:#FFFFFF; --sunk:#FCEFD0; --ink:#1E2247; --muted:#5D6088; --line:#EAD9AE;
  --honey:#F2A900; --honey-deep:#C47F00; --honey-soft:#FFE7A3;
  --ok:#1F9D63; --ok-soft:#D7F5E6; --bad:#D9483B; --bad-soft:#FDE1DD; --sky:#3A62D6;
  --display:"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --letter:"Andika", "Comic Sans MS", "Trebuchet MS", sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14162E; --surface:#1E2142; --sunk:#262A52; --ink:#F6F1E4; --muted:#B3B4D6; --line:#353A6B;
  --honey:#FFC233; --honey-deep:#FFD066; --honey-soft:#4A3F1C;
  --ok:#3CCB8A; --ok-soft:#173E31; --bad:#FF7466; --bad-soft:#4A2228; --sky:#8EA8FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14162E; --surface:#1E2142; --sunk:#262A52; --ink:#F6F1E4; --muted:#B3B4D6; --line:#353A6B;
  --honey:#FFC233; --honey-deep:#FFD066; --honey-soft:#4A3F1C;
  --ok:#3CCB8A; --ok-soft:#173E31; --bad:#FF7466; --bad-soft:#4A2228; --sky:#8EA8FF; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--honey) 18%, transparent) 1px, transparent 0);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:grid;gap:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.25rem;margin-right:auto}
.brand svg{width:34px;height:34px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:800;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--honey);color:#1E2247}
.dl{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 8px;display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted)}
.dl b{display:block;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.dl i{display:block;height:100%;width:0;background:var(--honey);transition:width .3s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;font-size:.92rem}
.chip b{font-family:var(--display);font-size:1.05rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--honey-deep)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--sunk);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--honey);color:#1E2247;box-shadow:0 4px 0 var(--honey-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--honey-deep)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.15rem;padding:16px 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}

/* hive map */
.hive{display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center;padding:8px 0}
.cell{width:104px;height:116px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--sunk);border:0;display:grid;place-items:center;text-align:center;position:relative;padding:14px 8px;overflow:hidden}
.cell .fill{position:absolute;inset:auto 0 0 0;background:var(--honey-soft);z-index:0}
.cell > span{position:relative;z-index:1;display:grid;gap:0;line-height:1.1}
.cell .n{font-family:var(--display);font-weight:800;font-size:1.6rem}
.cell .t{font-size:.72rem;font-weight:800}
.cell .p{font-size:.7rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.cell.done{background:var(--honey)}
.cell.done .p,.cell.done .t,.cell.done .n{color:#1E2247}
.cell.cur{outline:none;background:var(--ok-soft)}
.cell.sel{transform:scale(1.08)}
.cell.sel:not(.done){background:var(--ok-soft)}
.cell.sel .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cell.locked{opacity:.5;cursor:not-allowed}

/* ring */
.ringbox{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--sunk)} .ring .fg{stroke:var(--honey);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-family:var(--display);font-weight:800}

/* play */
.stage{display:grid;gap:16px;text-align:center}
.listen{width:132px;height:132px;border-radius:50%;border:0;background:var(--honey);color:#1E2247;box-shadow:0 6px 0 var(--honey-deep);display:grid;place-items:center;margin:0 auto}
.listen svg{width:60px;height:60px}
.listen.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.hints{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hints .btn{padding:8px 12px;font-size:.92rem}
.clue{background:var(--sunk);border-radius:14px;padding:12px 16px;text-align:left;display:grid;gap:4px}
.clue .lab{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.clue .en{font-family:var(--letter);font-size:1.1rem}
input.spell{font-family:var(--letter);font-size:clamp(1.6rem,6vw,2.4rem);text-align:center;letter-spacing:.12em;width:100%;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
input.spell:focus{border-color:var(--honey);outline:none}
.word{font-family:var(--letter);font-weight:700;font-size:clamp(2rem,8vw,3.2rem);letter-spacing:.06em;line-height:1.1;word-break:break-word}
.pron{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.syl{font-family:var(--letter);font-size:1.25rem;background:var(--sunk);padding:2px 10px;border-radius:10px}
.syl.st{background:var(--honey);color:#1E2247;font-weight:700}
.fb{border-radius:16px;padding:16px;display:grid;gap:10px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb h3{font-size:1.5rem}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.diff{font-family:var(--letter);font-size:1.6rem;letter-spacing:.1em;word-break:break-all}
.diff .x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:3px}
.diff .m{color:var(--bad);font-weight:700;background:color-mix(in srgb,var(--bad) 18%,transparent);border-radius:4px}
.diff .g{color:var(--ok)}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sunk);display:block}
.dots i.on{background:var(--ok)} .dots i.now{background:var(--honey)}
.mic{border:0;border-radius:999px;background:var(--sky);color:#fff;font-weight:800;font-size:1.2rem;padding:16px 28px;display:inline-flex;align-items:center;gap:10px;margin:0 auto;box-shadow:0 5px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.mic svg{width:30px;height:30px}
.mic.on{background:var(--bad);animation:pulse 1s infinite;box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.secret{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.secret i{width:26px;height:34px;border-bottom:4px solid var(--honey);display:grid;place-items:end center;font-family:var(--letter);font-weight:700;font-size:1.4rem;font-style:normal;line-height:1}
.secret i.sp{border:0;width:12px}
.word.reveal span{display:inline-block;animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.8)}}
.micbig{width:150px;height:150px;border-radius:50%;border:0;background:var(--sky);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.micbig svg{width:70px;height:70px}
.micbig.on{background:var(--bad);animation:pulse 1s infinite;box-shadow:0 0 0 12px color-mix(in srgb,var(--bad) 25%,transparent)}
.micbig.wait{opacity:.45;box-shadow:none}
.steps{list-style:none;margin:0 auto;padding:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-weight:800;font-size:.85rem}
.steps li{padding:4px 12px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps li.now{background:var(--sky);color:#fff}
.steps li.ok{background:var(--ok-soft);color:var(--ok)}
.heard{font-family:var(--letter);font-size:1.5rem;letter-spacing:.1em;min-height:2em}
.ritual{margin:0 auto;padding-left:1.4em;text-align:left;color:var(--muted);font-size:.92rem;display:grid;gap:2px;max-width:340px}
.newtag{display:inline-block;background:var(--sky);color:#fff;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.8rem;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:20;max-width:calc(100% - 32px);text-align:center}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;z-index:30;padding:16px}
.overlay .card{max-width:440px;text-align:center;display:grid;gap:14px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}

/* list */
.letters{display:flex;flex-wrap:wrap;gap:4px}
.letters button{width:38px;height:38px;border-radius:10px;border:0;background:var(--sunk);font-family:var(--letter);font-weight:700;font-size:1.05rem}
.letters button[aria-pressed="true"]{background:var(--honey);color:#1E2247}
.wl{display:grid;gap:8px}
.wi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.wi .w{font-family:var(--letter);font-weight:700;font-size:1.2rem}
.wi .d{font-size:.88rem;color:var(--muted)}
.wi .pp{font-family:var(--letter);font-size:.95rem}
.wi .pp b{color:var(--honey-deep)}
.say{width:44px;height:44px;border-radius:50%;border:0;background:var(--honey);color:#1E2247;display:grid;place-items:center;flex:none}
.say svg{width:22px;height:22px}
.state{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 10px;white-space:nowrap}
.state.m{background:var(--ok-soft);color:var(--ok)} .state.l{background:var(--honey-soft);color:var(--honey-deep)} .state.n{background:var(--surface);color:var(--muted)} .state.h{background:var(--bad-soft);color:var(--bad)}

/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--sunk);border-radius:14px;padding:12px 14px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:.82rem;color:var(--muted);font-weight:700}
.chart{overflow-x:auto}
.chart svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.bars rect.b{fill:var(--honey)} .bars rect.b.full{fill:var(--ok)}
.bars line.goal{stroke:var(--bad);stroke-dasharray:4 4;stroke-width:1.5}
.bars line.grid{stroke:var(--line)}
.lvlbar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.track{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;background:var(--honey);border-radius:99px}
.track i.ok{background:var(--ok)}
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.az div{border-radius:10px;padding:6px 0;text-align:center;font-family:var(--letter);font-weight:700;background:var(--sunk);position:relative;overflow:hidden}
.az div small{display:block;font-family:var(--body);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tbl{overflow-x:auto}
label.f{display:grid;gap:6px;font-weight:700}
label.f input,label.f select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.sync{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){
  .brand{font-size:1.05rem} .brand svg{width:28px;height:28px}
  nav.tabs button{padding:4px 9px;font-size:.88rem}
  .wrap{gap:10px;padding-block:10px 32px}
  .stage{gap:10px}
  .listen{width:84px;height:84px} .listen svg{width:40px;height:40px}
  .micbig{width:108px;height:108px} .micbig svg{width:52px;height:52px}
  .hints{gap:6px} .hints .btn{padding:6px 10px;font-size:.82rem}
  .chip{padding:2px 9px;font-size:.8rem}
  .btn.ghost{padding:6px 12px}
  .secret{gap:4px} .secret i{width:20px;height:28px;font-size:1.1rem}
  .steps{font-size:.78rem}
  .fb{padding:12px} .fb h3{font-size:1.25rem}
  .word{font-size:clamp(1.6rem,9vw,2.4rem)}
  .hive{gap:4px 2px} .cell{width:76px;height:86px;padding:10px 4px} .cell .t{font-size:.62rem} .cell .n{font-size:1.1rem}
  .btn.big{font-size:1rem;padding:13px 18px}
  h1{font-size:1.45rem!important}
  .lvlbar{grid-template-columns:90px 1fr 54px}
  .cell{width:88px;height:98px}
  .cell .n{font-size:1.3rem}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

/* Carga en orden: primero el nivel elegido (lo justo para empezar), luego el micrófono, luego los demás niveles de fácil a difícil */
const LOAD = { queue:[], cur:'', pct:0, done:new Set(), failed:false, mic:null };
const levelReady = i => LOAD.done.has('base') && LOAD.done.has('l' + i + 'w');
function loadPlan(){
  const s = S.sel, rest = [...LEVELS.keys()].filter(i => i > s).concat([...LEVELS.keys()].filter(i => i < s));

  if (MIC_HOST) plan.push('MIC');
  plan.push('l' + s + 'c');
  rest.forEach(i => plan.push('l' + i + 'w', 'l' + i + 'c'));

}
const spriteLabel = sp => sp === 'base' ? 'sonidos básicos' : sp === 'MIC' ? 'micrófono' : `nivel ${+sp[1] + 1} (${sp[2] === 'w' ? 'palabras' : 'definiciones y oraciones'})`;
let loaderRunning = false;
async function runLoader(){
  if (loaderRunning) return; loaderRunning = true;
  for (;;){
    const plan = loadPlan(); if (!plan.length) break;
    const sp = plan[0]; LOAD.cur = sp; LOAD.pct = 0; paintLoad();
    try {
      const prog = (g, t) => { LOAD.pct = t ? Math.round(100 * g / t) : 0; paintLoad(); }, net = () => { LOAD.net = true; paintLoad(); };
      LOAD.net = false;
      if (sp === 'MIC') await micLoad(net);
      // solo se decodifica lo que se usa ya; lo demás se guarda en la tablet para después
      else if (sp === 'base' || sp === 'l' + S.sel + 'w') await getBuf(sp, prog, net);
      else if (!bufs[sp]) await fetchBytes('audio/' + sp + '.mp3', prog, net, true);
      LOAD.done.add(sp);
      if (sp === 'l' + S.sel + 'w' && !G && tab === 'home') render();
      if (sp === 'MIC' && G){ render(); autoListen(); }
    } catch(e){ LOAD.failed = true; LOAD.done.add(sp); paintLoad(); }
  }

}
function paintLoad(){
  const el = document.getElementById('dl'); if (!el) return;
  const all = ['base', ...LEVELS.flatMap((_, i) => ['l' + i + 'w', 'l' + i + 'c']), ...(MIC_HOST ? ['MIC'] : [])];
  const n = all.filter(x => LOAD.done.has(x)).length;
  if (!LOAD.cur || !LOAD.net){ el.hidden = true; return; }
  el.hidden = false;
  const mb = LOAD.cur === 'MIC' && LOAD.mic ? ` · ${LOAD.mic}` : '';
  el.querySelector('span').textContent = `Descargando ${spriteLabel(LOAD.cur)}${mb} · ${LOAD.pct}%  —  ${n} de ${all.length} partes listas${levelReady(S.sel) ? '. Ya puedes jugar.' : ''}`;
  el.querySelector('i').style.width = Math.round(100 * (n + LOAD.pct / 100) / all.length) + '%';
}

const wordTokens = w => w.toLowerCase().split(/[\s-]+/).filter(Boolean);
const lettersOf = w => w.toLowerCase().replace(/ /g, '');
// Nombres de letras en inglés (y cómo los puede escribir el reconocedor) -> letra
const LN = { a:'a',ay:'a',eh:'a',b:'b',be:'b',bee:'b',c:'c',see:'c',sea:'c',si:'c',d:'d',dee:'d',e:'e',ee:'e',f:'f',ef:'f',eff:'f',g:'g',gee:'g',h:'h',aitch:'h',i:'i',eye:'i',aye:'i',j:'j',jay:'j',k:'k',kay:'k',l:'l',el:'l',ell:'l',m:'m',em:'m',n:'n',en:'n',o:'o',oh:'o',owe:'o',p:'p',pee:'p',pea:'p',q:'q',queue:'q',cue:'q',r:'r',are:'r',ar:'r',s:'s',es:'s',ess:'s',t:'t',tee:'t',tea:'t',u:'u',you:'u',yew:'u',v:'v',vee:'v',w:'w',x:'x',ex:'x',y:'y',why:'y',z:'z',zee:'z',zed:'z' };
// Gramática para decir la palabra: la correcta + distractoras, para que una mala pronunciación no "parezca" la palabra
function grammarSay(w){
  const others = shuffle(WORDS.filter(x => x.w !== w && !MIC.oov.has(x.w.toLowerCase())).map(x => x.w.toLowerCase())).slice(0, 40);
  return JSON.stringify([...new Set([wordTokens(w).join(' '), ...others.map(o => wordTokens(o).join(' ')), '[unk]'])]);
}
// Gramática para deletrear: solo nombres de letras (más la palabra, que se dice antes y después)
function grammarSpell(w){ return JSON.stringify([...new Set([...Object.keys(LN), 'double', 'hyphen', 'dash', 'space', 'capital', ...wordTokens(w), '[unk]'])]); }
// "shave s h a v e shave" -> "shave"
function parseSpelling(text, word){
  const wt = wordTokens(word), n = wt.length;
  let t = text.toLowerCase().replace(/\[unk\]/g, ' ').split(/\s+/).filter(Boolean);
  const at = i => wt.every((w, j) => t[i + j] === w);
  while (t.length >= n && at(0)) t = t.slice(n);
  while (t.length >= n && at(t.length - n)) t = t.slice(0, t.length - n);
  let out = '';
  for (let i = 0; i < t.length; i++){
    const k = t[i];
    if (k === 'double'){ const nx = t[i+1]; if (nx === 'you' || nx === 'u' || nx === 'yew'){ out += 'w'; i++; } else if (LN[nx]){ out += LN[nx] + LN[nx]; i++; } continue; }
    if (k === 'hyphen' || k === 'dash'){ out += '-'; continue; }
    if (LN[k]) out += LN[k];
  }
  return out;
}
async function micStart(){
  stopAudio();

    MIC.stream = MIC.stream || await navigator.mediaDevices.getUserMedia({ video:false, audio:{ echoCancellation:true, noiseSuppression:true, channelCount:1 } });
  } catch(e){ MIC.denied = true; render(); return; }
  MIC.denied = false;
  MIC.ac = MIC.ac || new (window.AudioContext || window.webkitAudioContext)();
  if (MIC.ac.state !== 'running') await MIC.ac.resume();
  const spelling = G.step === 'spell', w = G.cur.w;
  MIC.rec = new MIC.model.KaldiRecognizer(MIC.ac.sampleRate, spelling ? grammarSpell(w) : grammarSay(w));
  MIC.text = ''; MIC.partial = ''; MIC.done = false; MIC.t0 = MIC.tChange = Date.now();
  MIC.rec.on('result', m => {
    const t = (m.result.text || '').trim(); if (!t) return;
    if (!spelling){ MIC.text = t; micFinish(); return; }
    MIC.text += ' ' + t; MIC.partial = ''; MIC.tChange = Date.now(); paintSpelling();
  });
  MIC.rec.on('partialresult', m => { if (!spelling) return; const p = m.result.partial || ''; if (p !== MIC.partial){ MIC.partial = p; MIC.tChange = Date.now(); paintSpelling(); } });
  MIC.src = MIC.ac.createMediaStreamSource(MIC.stream);
  MIC.node = MIC.ac.createScriptProcessor(4096, 1, 1);
  MIC.node.onaudioprocess = ev => { try { MIC.rec && MIC.rec.acceptWaveform(ev.inputBuffer); } catch(_){} };
  MIC.src.connect(MIC.node); MIC.node.connect(MIC.ac.destination);
  MIC.state = 'rec'; render();
  if (spelling){
    // Deletreo: termina cuando ya dijo todas las letras y hace una pausa, o tras una pausa larga, o al tocar "Terminé"
    const need = lettersOf(w).length;
    MIC.timer = setInterval(() => {
      const got = parseSpelling(MIC.text + ' ' + MIC.partial, w).length, idle = Date.now() - MIC.tChange, total = Date.now() - MIC.t0;
      if ((got >= need && idle > 1300) || (got > 0 && idle > 3500) || (got === 0 && total > 10000) || total > 40000) micStop();

}
function paintSpelling(){
  const box = document.querySelector('.secret'); if (!box || !G) return;
  const got = parseSpelling(MIC.text + ' ' + MIC.partial, G.cur.w), cells = box.querySelectorAll('i:not(.sp)');
  cells.forEach((c, i) => { c.textContent = got[i] ? got[i].toUpperCase() : ''; });
  const extra = document.getElementById('heard'); if (extra) extra.textContent = got.length > cells.length ? got.toUpperCase().split('').join(' ') : '';
}
function micDisconnect(){ clearTimeout(MIC.timer); clearInterval(MIC.timer); try { MIC.src && MIC.src.disconnect(); MIC.node && MIC.node.disconnect(); } catch(_){} MIC.node = MIC.src = null; }
function micStop(){
  if (MIC.state !== 'rec') return;
  micDisconnect(); MIC.state = 'idle';
  try { MIC.rec.retrieveFinalResult(); } catch(_){}
  setTimeout(micFinish, 900);
}
function micAbort(){ micDisconnect(); MIC.done = true; try { MIC.rec && MIC.rec.remove(); } catch(_){} MIC.rec = null; if (MIC.state === 'rec') MIC.state = 'idle'; }
function micFinish(){
  if (MIC.done) return; MIC.done = true;
  micDisconnect(); if (MIC.state === 'rec') MIC.state = 'idle';
  try { MIC.rec && MIC.rec.remove(); } catch(_){} MIC.rec = null;
  if (!G || G.phase !== 'ask') return;
  const all = (MIC.text + ' ' + (MIC.partial || '')).replace(/\[unk\]/g, '').trim();
  if (!all){ G.silent = (G.silent || 0) + 1; if (G.silent < 3){ render(); micStart(); } else { render(); toast('Toca el micrófono cuando estés lista.'); } return; }
  G.silent = 0;
  if (G.step === 'spell') return spellResult(parseSpelling(all, G.cur.w));
  const target = wordTokens(G.cur.w).join(' ');
  const lenient = MIC.oov.has(G.cur.w.toLowerCase()) || G.fails >= 5; // el micrófono no conoce la palabra, o 5 intentos sin lograrlo

}
// Primer error de la palabra: cuenta para el reporte y la palabra vuelve pronto
function markMiss(){
  if (G.missed) return; G.missed = true;
  const st = W(G.cur.w), day = D(), exam = G.mode === 'exam' || G.mode === 'final';
  st.s++; day.a++; st.x++; st.b = 0; st.due = dayNum(); G.streak = 0;
  if (!exam) G.retry.push({ w:G.cur.w, at:G.turn + 3 });

}
const isExam = () => G.mode === 'exam' || G.mode === 'final';
// Paso 1: pronunciación
function sayResult(ok, said){
  const x = G.cur;
  if (ok){
    const pts = G.fails ? 2 : 5; G.gain = (G.gain || 0) + pts; S.points += pts;
    G.step = 'spell'; G.heard = ''; sndOk(); save(); render();
    setTimeout(() => { if (G && G.cur === x && G.step === 'spell') autoListen(); }, 350);
    return;
  }
  markMiss(); G.fails = (G.fails || 0) + 1; G.heard = said; sndBad();
  if (isExam()){ G.phase = 'wrong'; G.attempt = said; G.oral = 'say'; render(); setTimeout(() => A.word(x, true), 500); return; }
  render(); setTimeout(() => { if (G && G.phase === 'ask') A.word(x, G.fails >= 2); }, 600);
}
// Paso 2: deletreo en voz alta; la palabra solo se escribe cuando la deletrea bien
function spellResult(got){
  const x = G.cur, ok = got === lettersOf(x.w).replace(/ /g, '');
  if (ok){
    const st = W(x.w), day = D();
    if (!G.missed){ st.s++; day.a++; day.o++; st.b = Math.min(st.b + 1, INTERVAL.length - 1); G.streak++; S.best = Math.max(S.best, G.streak); if (isExam()) G.examOk++; }
    st.c++; st.due = dayNum() + INTERVAL[st.b];
    if (st.b >= MASTER_BOX && !st.m){ st.m = 1; day.n++; G.newMaster = true; }
    const pts = G.sfails ? 3 : 10; G.gain = (G.gain || 0) + pts; S.points += pts;
    G.phase = 'right'; sndOk(); save(); render();
    const cur = x; setTimeout(() => A.spell(cur, () => setTimeout(() => { if (G && G.phase === 'right' && G.cur === cur){ if (isExam()) G.idx++; nextWord(); } }, 900)), 500);
    return;
  }
  markMiss(); G.sfails = (G.sfails || 0) + 1; G.heardSpell = got; sndBad();
  if (isExam()){ G.phase = 'wrong'; G.attempt = got; G.oral = 'spell'; render(); setTimeout(() => A.spell(x), 500); return; }
  // Escucha cómo se deletrea y vuelve a intentarlo
  render(); setTimeout(() => { if (G && G.phase === 'ask') play(['W_' + IDX[x.w], ...x.w.split('').map(letterId), 'W_' + IDX[x.w]], x.w); }, 600);
}

function tone(seq){ try { let t = ctx().currentTime; const actx = ctx();
  seq.forEach(([f,d,type]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type||'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02); t += d*.8; }); } catch(e){} }
const sndOk = () => tone([[660,.12],[880,.18]]);
const sndBad = () => tone([[220,.22,'triangle'],[185,.28,'triangle']]);
const sndWin = () => tone([[523,.14],[659,.14],[784,.14],[1047,.4]]);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[‐-–—]/g,'-');
const ICON_SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function pronHTML(p){ return '<div class="pron" aria-label="Pronunciación fácil">' + p.split(/[-\s]+/).map(s => `<span class="syl${s === s.toUpperCase() && /[A-Z]/.test(s) ? ' st' : ''}">${esc(s.toLowerCase())}</span>`).join('') + '</div>'; }

function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; el.setAttribute('role','status'); document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function showOverlay(title, text, btn){

  o.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(text)}</p><button class="btn primary big" id="ovok">${esc(btn)}</button></div>`;

function align(a, b){
  const n = a.length, m = b.length, T = Array.from({length:n+1}, (_,i) => Array.from({length:m+1}, (_,j) => i ? (j ? 0 : i) : j));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) T[i][j] = Math.min(T[i-1][j]+1, T[i][j-1]+1, T[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  let i = n, j = m; const A = [], B = [];
  while (i > 0 || j > 0){
    if (i > 0 && j > 0 && T[i][j] === T[i-1][j-1] + (a[i-1]===b[j-1]?0:1)){ const ok = a[i-1]===b[j-1]; A.unshift([a[i-1],ok]); B.unshift([b[j-1],ok]); i--; j--; }
    else if (i > 0 && T[i][j] === T[i-1][j]+1){ A.unshift([a[i-1],false]); i--; }
    else { B.unshift([b[j-1],false]); j--; }
  }
  return { A, B };
}

let G = null; // sesión activa
let tab = 'home';
function startGame(mode, opt = {}){
  const lv = opt.level ?? S.sel;
  let list;
  if (mode === 'practice') list = LEVELS[lv];
  else if (mode === 'letter') list = WORDS.filter(x => x.w[0].toLowerCase() === opt.letter).map(x => x.w);
  else if (mode === 'errors') list = Object.entries(S.words).filter(([w,s]) => s.x > 0 && BYW[w]).sort((a,b) => (b[1].x - b[1].c*0.5) - (a[1].x - a[1].c*0.5)).slice(0, 25).map(([w]) => w);
  else if (mode === 'exam') list = shuffle(LEVELS[lv]).slice(0, EXAM_LEN);
  else if (mode === 'final') list = shuffle(WORDS.map(x => x.w)).slice(0, FINAL_LEN);
  if (!list || !list.length){ toast(mode === 'errors' ? 'Todavía no hay errores para repasar. ¡Bien!' : 'No hay palabras aquí.'); return; }
  G = { mode, level:lv, letter:opt.letter, list, order: shuffle(list), idx:0, turn:0, recent:[], retry:[], cur:null, phase:'ask', hints:{}, streak:0, examOk:0 };
  sessionSec = sessionSec || 0;
  nextWord();
}
function pickPractice(){
  G.turn++;

  const az = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => WORDS.some(x => x.w[0].toLowerCase() === c)).map(c => { const ws = WORDS.filter(x => x.w[0].toLowerCase() === c), m = ws.filter(x => mastered(x.w)).length, p = m/ws.length; return `<div style="background:color-mix(in srgb,var(--ok) ${Math.round(p*70)}%,var(--sunk))">${c.toUpperCase()}<small>${m}/${ws.length}</small></div>`; }).join('');
  const hard = r.hard.length ? `<div class="tbl"><table class="t"><thead><tr><th>Palabra</th><th>Así la escribe mal</th><th style="text-align:right">Errores</th><th style="text-align:right">Aciertos</th></tr></thead><tbody>${r.hard.map(([w,s]) => `<tr><td><b style="font-family:var(--letter)">${esc(w)}</b></td><td class="muted">${esc(BYW[w].p.toLowerCase())}</td><td class="n">${s.x}</td><td class="n">${s.c}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Aún no hay errores registrados.</p>';
  return `<section class="card" style="display:grid;gap:16px">
    <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Para papá y mamá</div><h2>Reporte de avance${S.name ? ' de ' + esc(S.name) : ''}</h2></div><button class="btn" data-act="copyrep">Copiar resumen</button></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${r.mast}<span class="muted" style="font-size:1rem">/${WORDS.length}</span></div><div class="k">palabras dominadas</div></div>
      <div class="kpi"><div class="v">${S.passed.filter(Boolean).length}<span class="muted" style="font-size:1rem">/${NLEV}</span></div><div class="k">niveles superados${S.champion ? ' · Campeona' : ''}</div></div>
      <div class="kpi"><div class="v">${r.acc}%</div><div class="k">precisión total (${r.totO}/${r.totA})</div></div>
      <div class="kpi"><div class="v">${Math.round(r.totSec/60)}</div><div class="k">minutos en total · ${r.played} días</div></div>
      <div class="kpi"><div class="v">${r.streak}</div><div class="k">días seguidos jugando</div></div>
      <div class="kpi"><div class="v">${r.eta ?? '—'}</div><div class="k">días estimados para dominar todo (ritmo de 7 días)</div></div>
    </div>
    <div><h3>Minutos por día</h3><p class="muted" style="margin:2px 0 8px;font-size:.9rem">Últimos 14 días. Línea roja: meta de ${goal} min. Verde: meta cumplida.</p><div class="chart">${chart}</div></div>
    <div style="display:grid;gap:8px"><h3>Niveles</h3>${lv}</div>
    <div style="display:grid;gap:8px"><h3>Por letra</h3><p class="muted" style="margin:0;font-size:.9rem">Más verde = más palabras dominadas de esa letra.</p><div class="az">${az}</div></div>
    <div style="display:grid;gap:8px"><h3>Palabras más difíciles</h3><p class="muted" style="margin:0;font-size:.9rem">Practíquenlas juntos en voz alta: digan la palabra, deletréenla y vuelvan a decirla, como en el concurso.</p>${hard}</div>
    <p class="sync" id="sync"></p>
  </section>`;
}
function summaryText(){
  const r = reportData(), l7 = r.l14.slice(-7);
  return `Reporte Spelling Bee${S.name ? ' – ' + S.name : ''} (${today()})
Palabras dominadas: ${r.mast} de ${WORDS.length}
Niveles superados: ${S.passed.filter(Boolean).length} de ${NLEV}${S.champion ? ' + Gran Final' : ''} (nivel actual: ${S.unlocked+1} ${LEVEL_NAMES[S.unlocked]})
Precisión total: ${r.acc}% (${r.totO}/${r.totA})
Tiempo total: ${Math.round(r.totSec/60)} min en ${r.played} días; racha de ${r.streak} días
Últimos 7 días: ${l7.map(([k,d]) => k.slice(5) + ' ' + Math.round(d.sec/60) + 'min').join(', ')}
Más difíciles: ${r.hard.slice(0,10).map(([w,s]) => w + ' (' + s.x + ')').join(', ') || 'ninguna'}`;
}
function vSettings(){
  return `<section class="card" style="display:grid;gap:16px;max-width:560px">
    <h2>Ajustes</h2>
    <label class="f">Nombre de la jugadora<input id="sname" value="${esc(S.name)}" placeholder="Ej. Sofía" maxlength="30"></label>
    <div style="display:grid;gap:6px"><b>Sonido</b><p class="muted" style="margin:0;font-size:.9rem">Las palabras, definiciones y oraciones vienen grabadas con voz en inglés de Estados Unidos. Si no se oye, sube el volumen de la tablet.</p>
    <div class="row"><button class="btn" data-act="testvoice">Probar sonido</button></div></div>
    <label class="f" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="sintro" ${S.settings.intro ? 'checked' : ''} style="width:22px;height:22px"> Decir "Your word is…" como en el concurso</label>
    <label class="f">Meta diaria (minutos)<input type="number" id="sgoal" min="10" max="120" step="5" value="${S.settings.goal}"></label>
    <div style="display:grid;gap:8px;border-top:2px solid var(--line);padding-top:14px"><b>Borrar progreso</b><p class="muted" style="margin:0;font-size:.9rem">Borra niveles, palabras dominadas y el historial de días. No se puede deshacer.</p>
      <div class="row"><button class="btn" data-act="reset1">Borrar todo…</button><span id="resetc" hidden><button class="btn" style="background:var(--bad);color:#fff" data-act="reset2">Sí, borrar todo</button></span></div></div>
    <p class="sync" id="sync"></p>
  </section>`;
}
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', !G && b.dataset.tab === tab ? 'page' : 'false'));
  const app = $('#app');
  app.innerHTML = G ? vPlay() : tab === 'list' ? vList() : tab === 'report' ? vReport() : tab === 'settings' ? vSettings() : vHome();
  paintSync();
  const inp = $('#ans') || $('#copy'); if (inp) setTimeout(() => inp.focus(), 30);
  if (G && (G.phase === 'right')) setTimeout(() => $('[data-act="next"]')?.focus(), 30);
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.tab){ G = null; stopAudio(); tab = t.dataset.tab; render(); scrollTo(0,0); return; }
  if (t.dataset.lv !== undefined){ const i = +t.dataset.lv; if (i <= S.unlocked){ S.sel = i; save(); render(); runLoader(); } else toast('Supera el examen del nivel anterior para abrir este.'); return; }
  if (t.dataset.final){ if (S.passed.every(Boolean)) startGame('final'); else toast('La Gran Final se abre al superar los 8 niveles.'); return; }
  if (t.dataset.go){ startGame(t.dataset.go, { letter:listLetter }); scrollTo(0,0); return; }
  if (t.dataset.letter){ listLetter = t.dataset.letter; sayAll = false; render(); return; }
  if (t.dataset.say){ sayAll = false; A.word(BYW[t.dataset.say]); return; }
  if (t.dataset.spell){ sayAll = false; A.spell(BYW[t.dataset.spell]); return; }
  const a = t.dataset.act, x = G?.cur;
  if (a === 'quit'){ G = null; stopAudio(); tab = 'home'; render(); }
  else if (a === 'hear') A.word(x);
  else if (a === 'slow') A.word(x, true);
  else if (a === 'spell') A.spell(x);
  else if (a === 'def') A.def(x);
  else if (a === 'sent') A.sent(x);
  else if (a === 'micstart') micStart();
  else if (a === 'micstop') micStop();
  else if (a === 'micretry'){ MIC.state = 'idle'; LOAD.done.delete('MIC'); runLoader(); render(); }
  else if (a === 'check'){ const v = $('#ans')?.value || ''; if (v.trim()) submit(v); else $('#ans')?.focus(); }
  else if (a === 'next'){ if (G.mode === 'exam' || G.mode === 'final') G.idx++; nextWord(); }
  else if (a === 'retryexam'){ startGame(G.mode, { level:G.level }); }
  else if (a === 'sayall'){ const ws = WORDS.filter(w => w.w[0].toLowerCase() === listLetter); let i = 0; sayAll = true; const go = () => { if (!sayAll || i >= ws.length || tab !== 'list' || G) return; const x = ws[i++]; play(['W_' + IDX[x.w]], x.w, () => setTimeout(go, 600)); }; go(); }
  else if (a === 'testvoice') play(['X_intro', 'W_' + IDX['encyclopedia']], 'Your word is encyclopedia');
  else if (a === 'copyrep'){ const txt = summaryText(); navigator.clipboard?.writeText(txt).then(() => toast('Resumen copiado'), () => fallbackCopy(txt)) ?? fallbackCopy(txt); }
  else if (a === 'reset1'){ $('#resetc').hidden = false; }
  else if (a === 'reset2'){ const keep = S.settings, name = S.name; S = blank(); S.settings = keep; S.name = name; save(); pushRemote(); toast('Progreso borrado'); render(); }
});
function fallbackCopy(txt){ const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'width:100%;min-height:160px'; $('#app').prepend(ta); ta.select(); toast('Selecciona y copia el texto'); }
document.addEventListener('submit', e => {
  e.preventDefault();
  if (!G) return;
  if (G.phase === 'ask'){ const v = $('#ans').value; if (v.trim()) submit(v); }
  else if (G.phase === 'wrong'){ const c = $('#copy'); if (norm(c.value) === norm(G.cur.w)){ sndOk(); nextWord(); } else { c.value = ''; c.placeholder = 'mira arriba y cópiala'; A.word(G.cur); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && G && G.phase === 'right' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); $('[data-act="next"]')?.click(); } });
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'ans' && S.settings.echo !== false && e.data && e.data.length === 1 && /[a-z\- ]/i.test(e.data)) A.letter(e.data);
  else if (id === 'sname'){ S.name = e.target.value.trim(); save(); }
  else if (id === 'sgoal'){ const g = Math.max(10, Math.min(120, +e.target.value || 60)); S.settings.goal = g; save(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sintro'){ S.settings.intro = e.target.checked; save(); }
  else if (e.target.id === 'secho'){ S.settings.echo = e.target.checked; save(); }
  else if (e.target.id === 'smic'){ S.settings.mic = e.target.checked; if (MIC.state === 'off') MIC.state = 'idle'; save(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} pushRemote(); } });

/* ---------- arranque ---------- */
(async function boot(){
  const local = loadLocal(); if (local) S = merge(local);
  render(); runLoader();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(_){}
  try {
    db = await window.claude?.use?.('db');
    if (db){
      const snap = await db.doc('progreso/principal').get();
      if (snap.exists){ const remote = snap.data(); if (remote && (remote.updatedAt||0) > (S.updatedAt||0)){ S = merge(remote); if (!G) render(); } }
      syncState = 'nube'; paintSync();
      if (!snap.exists && S.updatedAt) pushRemote();
    }
  } catch(e){ db = null; syncState = 'local'; paintSync(); }
})();
</script>
</body></html>
